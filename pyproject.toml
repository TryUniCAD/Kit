[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kit"
version = "0.1.0"
description = "CAD interchange SDK by Parashell."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Parashell, Inc." },
    { name = "Odin Glynn-Martin", email = "odin.glynn@parashell.cloud" },
    { name = "Stephen Harcourt" },
]
maintainers = [
    { name = "Odin Glynn-Martin", email = "odin.glynn@parashell.cloud" },
]
keywords = ["cad"]
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = []

[project.urls]
Repository = "https://github.com/TryParashell/Kit"
Issues = "https://github.com/TryParashell/Kit/issues"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pywin32==312 ; sys_platform == 'win32'",
]

[project.entry-points."kit"]
convert = "convert:convert"

[tool.hatch.build.targets.wheel]
packages = ["src/interchange", "src/convert"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["*Test.py", "*Tests.py"]
python_functions = ["test_*", "Test*", "Check*"]
collect_imported_tests = false

[tool.black]
line-length = 88
target-version = ["py311"]

[dependency-groups]
dev = [
    "black==26.3.1",
]
