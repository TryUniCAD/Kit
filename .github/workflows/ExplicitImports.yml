name: Explicit imports

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci-reuse:
    name: PR CI reuse (Explicit imports)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - name: Checkout phase selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &ReadPhase
        name: Read the trusted base validation phase
        id: phase
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { SetPhase } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/CiPhase.cjs`);
            await SetPhase({ github, context, core });

  verify-imports:
    if: github.event_name == 'pull_request'
    name: Reject Python wildcard imports
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *ReadPhase

      - name: Set up uv
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: uv sync --frozen --python 3.11

      - name: Verify explicit Python imports
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: |
          uv run python - <<'PYTHON'
          import ast as AstLib
          import os as OsTools
          import subprocess as Subprocess
          import sys as System
          from pathlib import Path as FilePath

          PathData = Subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.py", ":(top,exclude)re/**"]
          )
          FilePaths = sorted(
              FilePath(OsTools.fsdecode(PathBytes))
              for PathBytes in PathData.split(b"\0")
              if PathBytes
          )
          FindingList = []
          for SourcePath in FilePaths:
              try:
                  SourceText = SourcePath.read_text(encoding="utf-8")
                  SyntaxTree = AstLib.parse(SourceText, filename=str(SourcePath))
              except (OSError, SyntaxError, UnicodeError) as ErrorInfo:
                  print(f"{SourcePath.as_posix()}: unable to inspect imports: {ErrorInfo}")
                  raise SystemExit(2) from ErrorInfo
              for AstNode in AstLib.walk(SyntaxTree):
                  if isinstance(AstNode, AstLib.ImportFrom) and any(
                      AliasInfo.name == "*" for AliasInfo in AstNode.names
                  ):
                      FindingList.append(
                          f"{SourcePath.as_posix()}:{AstNode.lineno}: wildcard import"
                      )
          for FindingText in FindingList:
              print(FindingText)
          if FindingList:
              raise SystemExit(1)
          print(f"explicit imports passed for {len(FilePaths)} python files")
          PYTHON
