name: Rationale comments

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci-reuse:
    name: Validation phase (RationaleComments)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - name: Checkout phase selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &ReadPhase
        name: Read the trusted base validation phase
        id: phase
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { SetPhase } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/CiPhase.cjs`);
            await SetPhase({ github, context, core });

  verify-rationale-comments:
    if: github.event_name == 'pull_request'
    name: Verify rationale comments on changed sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - *ReadPhase

      - name: Set up uv
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: uv sync --frozen --extra dev --python 3.11

      - name: Verify rationale comments across every tracked owned source
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: uv run python -m tools.Steering.CheckRationaleComments

      - name: Reject newly added explanatory comments
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || '' }}
        run: |
          Arguments=()
          if [ -n "$BASE_REF" ]; then
            Arguments=(--base "$BASE_REF" --head "$HEAD_REF")
          fi
          uv run python -m tools.Steering.CheckRationaleComments "${Arguments[@]}"

      - name: Verify renamed source comment history
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: uv run --extra dev pytest tests/Steering/RationaleRenameTests.py
