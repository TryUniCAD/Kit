name: Candidate quality audit
on:
  push:
    branches: [fix/pr158-quality-audit-20261120]
permissions:
  contents: read
jobs:
  pyright:
    name: Pyright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run strict Pyright
        run: uv run pyright

  mypy:
    name: Mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run strict Mypy
        run: uv run mypy

  steering:
    name: Python steering
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Verify tracked Python sources
        run: |
          mapfile -d '' PythonFiles < <(git ls-files -z -- '*.py')
          uv run python -m tools.Steering.SteeringCompliance \
            --baseline-file tools/Steering/SteeringBaseline.txt \
            "${PythonFiles[@]}"

      - name: Verify no recorded payloads
        run: uv run python -m tools.Donors.CheckReplays src

  policy:
    name: Verify CI policy and pytest compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Verify repository CI contracts at process boundaries
        run: >-
          uv run pytest tests/Policy/CodeqlPolicyTests.py
          tests/Policy/CiReportsTests.py tests/Policy/QueueAggregationTests.py
          tests/Policy/ReviewerAggregationTests.py tests/Steering/AgentSkillsMigrationTests.py
          tests/Convert/Api/ApiMetadataTests.py tests/Policy/DiffBreakdownTests.py
          tests/Policy/ShardPlanTests.py
          tests/Convert/Commands/CliRuntimeTests.py

      - name: Exercise native file reading and writing
        run: >-
          uv run pytest
          tests/Convert/Solidworks
          tests/Convert/Formats/ParasolidTests.py
          tests/Steering/RationaleCommentsTests.py

  research-cli:
    name: Research CLI compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KIT_RESEARCH_CHECKOUT: ${{ github.workspace }}/ResearchCheckout
    steps:
      - name: Checkout candidate CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout candidate research tools separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ResearchCheckout
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install CLI and compatibility dependencies
        run: uv sync --frozen --no-default-groups --extra dev --python 3.14

      - name: Hydrate sealed research inputs for candidate CLI cases
        run: uv run --no-sync --python 3.14 python re/automation/CaptureHistory.py fetch --root ResearchCheckout

      - name: Verify deterministic tools through the installed CLI
        run: >-
          uv run --no-sync --python 3.14 python -m pytest tests/CliResearch -q

  research-cli-windows:
    name: Research CLI Windows compatibility
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      KIT_RESEARCH_CHECKOUT: ${{ github.workspace }}/ResearchCheckout
    steps:
      - name: Checkout candidate CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout candidate research tools separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ResearchCheckout
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install CLI and compatibility dependencies
        run: uv sync --frozen --no-default-groups --extra dev --python 3.14

      - name: Hydrate sealed research inputs for candidate CLI cases
        run: uv run --no-sync --python 3.14 python re/automation/CaptureHistory.py fetch --root ResearchCheckout

      - name: Verify reader and controller exit statuses through the installed CLI
        run: >-
          uv run --no-sync --python 3.14 python -m pytest
          tests/CliResearch/BridgeRejectTests.py
          tests/CliResearch/SwReaderTests.py
          tests/CliResearch/FusionReaderTests.py
          tests/CliResearch/ReaderRejectTests.py
          tests/CliResearch/InterruptTests.py
          tests/CliResearch/LeaseFlowTests.py -q

  rectangle-evidence:
    name: Compare rectangle reports and inspect partition selection
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.5"
      - run: uv sync --frozen --no-default-groups --extra dev --python 3.14
      - run: uv run --no-sync python re/automation/CaptureHistory.py fetch
      - name: Inspect the partition inputs for missing solids
        run: |
          mkdir -p "$RUNNER_TEMP/kit-base"
          git archive fa4c497e4 src | tar -x -C "$RUNNER_TEMP/kit-base"
          cat > "$RUNNER_TEMP/compare-source.py" <<'PY'
          from pathlib import Path
          from convert import open_document
          from convert.Geometry import Parasolid
          from convert.adapters.freecad.Brep import BrepModelBrep
          folder = Path('re/solidworks/examples/Single Turbo Dual Overhead Cam V8 - KDP - 2024')
          for name in ('10MM x 20MM x 13MM head 316 Stainless Steel Socket Head Screw.SLDPRT', '8MM x 15mm - 12 point screw.SLDPRT', 'CUIETA DE ENTRADA DE GASES.SLDPRT'):
              doc = open_document(folder / name)
              print(name, [(cfg.name,cfg.active) for cfg in doc.configurations], 'has_brep', doc.brep is not None)
              for payload in doc.brep_payloads:
                  if payload.data:
                      model, why = Parasolid.ReadBrepResult(payload.data) if hasattr(Parasolid, "ReadBrepResult") else (Parasolid.DecodeBrepModel(payload.data), "")
                      print(payload.source_stream, payload.kind, len(payload.data), getattr(Parasolid.ParaHeaderData(payload.data), 'schema', None), model is not None, why)
              if doc.brep:
                  try:
                      BrepModelBrep(doc.brep)
                  except ValueError as error:
                      print(str(error))
          PY
          for source in "$RUNNER_TEMP/kit-base/src" "$PWD/src"; do
            echo "$source"
            PYTHONPATH="$source" .venv/bin/python "$RUNNER_TEMP/compare-source.py"
          done
      - name: Identify changed fields against the original archived reporter
        run: |
          set -eu
          revision=92fd0da165cf3eed3e50331459cf2ea3e983f2be
          git fetch --no-tags --filter=blob:none origin "$revision"
          reference="$RUNNER_TEMP/rectangle-reference"
          git worktree add --detach --no-checkout "$reference" "$revision"
          git -C "$reference" restore --source=HEAD --staged --worktree -- src re/automation re/Fusion/Study re/solidworks/archive
          python - "$reference/re/automation/PairedCaptureIntake.py" <<'PYTHON'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          source = path.read_text()
          original = 'self.root, "rev-list", "--objects", "--no-object-names", revision + "^@"'
          assert source.count(original) == 1
          path.write_text(source.replace(original, original.replace('"--objects",', '"--missing=print", "--objects",')).replace('self.ancestry[revision] = set(git(', 'self.ancestry[revision] = set(item.removeprefix("?") for item in git('))
          PYTHON
          .venv/bin/python "$reference/re/automation/RectanglePairEvidence.py" > "$RUNNER_TEMP/reference.json"
          .venv/bin/python re/automation/RectanglePairEvidence.py > "$RUNNER_TEMP/current.json"
          sha256sum "$RUNNER_TEMP/reference.json" "$RUNNER_TEMP/current.json"
          diff -u "$RUNNER_TEMP/reference.json" "$RUNNER_TEMP/current.json" | head -240 || true
