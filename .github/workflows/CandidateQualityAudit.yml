name: Candidate quality audit
on:
  push:
    branches: [fix/pr158-quality-audit-20261120]
permissions:
  contents: read
jobs:
  pyright:
    name: Pyright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run strict Pyright
        run: uv run pyright

  mypy:
    name: Mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run strict Mypy
        run: uv run mypy

  steering:
    name: Python steering
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Verify tracked Python sources
        run: |
          mapfile -d '' PythonFiles < <(git ls-files -z -- '*.py')
          uv run python -m tools.Steering.SteeringCompliance \
            --baseline-file tools/Steering/SteeringBaseline.txt \
            "${PythonFiles[@]}"

      - name: Verify no recorded payloads
        run: uv run python -m tools.Donors.CheckReplays src

  policy:
    name: Verify CI policy and pytest compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Verify repository CI contracts at process boundaries
        run: >-
          uv run pytest tests/Policy/CodeqlPolicyTests.py
          tests/Policy/CiReportsTests.py tests/Policy/QueueAggregationTests.py
          tests/Policy/ReviewerAggregationTests.py tests/Steering/AgentSkillsMigrationTests.py
          tests/Convert/Api/ApiMetadataTests.py tests/Policy/DiffBreakdownTests.py
          tests/Policy/ShardPlanTests.py
          tests/Convert/Commands/CliRuntimeTests.py

      - name: Exercise native file reading and writing
        run: >-
          uv run pytest
          tests/Convert/Solidworks
          tests/Convert/Formats/ParasolidTests.py
          tests/Steering/RationaleCommentsTests.py

  research-cli:
    name: Research CLI compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KIT_RESEARCH_CHECKOUT: ${{ github.workspace }}/ResearchCheckout
    steps:
      - name: Checkout candidate CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout candidate research tools separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ResearchCheckout
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install CLI and compatibility dependencies
        run: uv sync --frozen --no-default-groups --extra dev --python 3.14

      - name: Hydrate sealed research inputs for candidate CLI cases
        run: uv run --no-sync --python 3.14 python re/automation/CaptureHistory.py fetch --root ResearchCheckout

      - name: Verify deterministic tools through the installed CLI
        run: >-
          uv run --no-sync --python 3.14 python -m pytest tests/CliResearch -q

  research-cli-windows:
    name: Research CLI Windows compatibility
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      KIT_RESEARCH_CHECKOUT: ${{ github.workspace }}/ResearchCheckout
    steps:
      - name: Checkout candidate CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout candidate research tools separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ResearchCheckout
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install CLI and compatibility dependencies
        run: uv sync --frozen --no-default-groups --extra dev --python 3.14

      - name: Hydrate sealed research inputs for candidate CLI cases
        run: uv run --no-sync --python 3.14 python re/automation/CaptureHistory.py fetch --root ResearchCheckout

      - name: Verify reader and controller exit statuses through the installed CLI
        run: >-
          uv run --no-sync --python 3.14 python -m pytest
          tests/CliResearch/BridgeRejectTests.py
          tests/CliResearch/SwReaderTests.py
          tests/CliResearch/FusionReaderTests.py
          tests/CliResearch/ReaderRejectTests.py
          tests/CliResearch/InterruptTests.py
          tests/CliResearch/LeaseFlowTests.py -q

  rectangle-evidence:
    name: Compare rectangle reports and inspect partition selection
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.5"
      - run: uv sync --frozen --no-default-groups --extra dev --python 3.14
      - run: uv run --no-sync python re/automation/CaptureHistory.py fetch
      - name: Verify cut report changes against the archived digest
        run: |
          .venv/bin/python re/automation/FusionCutState/VerifyCutState.py > "$RUNNER_TEMP/cut-report.json"
          python - "$RUNNER_TEMP/cut-report.json" <<'PYTHON'
          import hashlib, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          current = b': feature fusion-feature-35-334 kind (native)'
          previous = b': feature fusion-feature-35-207 kind (native); ' + current
          print("cut report", hashlib.sha256(data).hexdigest(), "changed refusal entries", data.count(current))
          assert hashlib.sha256(data.replace(current, previous)).hexdigest() == '98fee890f42e66362571036c7b627c3d2b9ee478bbcaad5a9776125ca68c9668'
          PYTHON
      - name: Check public sketch and revolve fixtures and native comparison
        run: .venv/bin/python -m pytest -q tests/Convert/Freecad/{SavedSketchTests,FusionPlaneRevReadTests}.py tests/Research/Archives/Comparison/NativeDirectionTests.py
      - name: Report export qualification on representative sketch controls
        run: |
          uv run --no-sync python - <<'PYTHON'
          from pathlib import Path
          from convert.Formats.Fusion.DocumentRead import ReadFusionDoc
          from convert.Formats.Fusion.ArchiveRead.IndexedArchive import OpenFusionZip
          from convert.Formats.Fusion.Sketches.SketchQualification import HasSketchRules, IsSketchOwner
          base = Path("re/Fusion/Study")
          for sample in ("extents-f0f33a9a605f/distance_positive.f3d", "models-97a5e41e2ba7/revolve_full.f3d", "sketches-0ccea2ac0f9c/radius.f3d", "bodyselections-62e42366c722/scale_two_bodies_point.f3d","holdouts-f8c508a73323/expression_depth.f3d","dimensions-f83a2edd2f72/dimensions.f3d","scaleshellinputs-97ef1cfd19e4/scale_construction_point.f3d"):
              path = base / sample
              doc = ReadFusionDoc(path)
              print("timeline",path.name,[(str(s.kind), bool(s.sketch_id), s.provenance.spans[0].record_kind if s.provenance and s.provenance.spans else None) for s in doc.feature_timeline])
              with OpenFusionZip(path.read_bytes(),None) as archive:
                  bulk, spans = archive.ReadDesign()
                  for sketch in doc.sketches:
                      root = next(r for r in spans if r.IsPrimary and str(r.ObjectId)==sketch.provenance.native_id)
                      frame = next(p for p in doc.support_planes if p.id == sketch.support_plane_id)
                      from convert.Formats.Fusion.Sketches.PrincipalRoute import PrincipalRoute
                      from convert.Formats.Fusion.Sketches.SketchPlacement import KSketchFeature
                      from convert.Formats.Fusion.HistoryRef import ReadNativeRef
                      from convert.Formats.Fusion.MetaCursor import MetaCursor
                      from convert.Formats.Fusion.SelectionRef import ReadDescLeaf, ReadEntityLeaf
                      from convert.Formats.Fusion.ConstructionPlane.OriginDatum import ReadOriginDatum
                      owners = {r.ObjectId:r for r in spans if r.IsPrimary}
                      feature = owners[ReadNativeRef(MetaCursor(bulk[root.EndOffset-15:root.EndOffset-4]))]
                      try:
                          PrincipalRoute(bulk,owners,feature)
                      except ValueError as error:
                          print('existing principal route:',str(error))
                      try:
                          cursor = MetaCursor(bulk[feature.PayloadOffset+4:feature.EndOffset])
                          cursor.Offset = 3
                          params = [ReadNativeRef(cursor) for _ in range(cursor.ReadCount(256))]
                          cursor.TakeBytes(1)
                          assert cursor.ReadWord() == 0
                          assert ReadNativeRef(cursor)==root.ObjectId
                          controller = ReadNativeRef(cursor)
                          arrays = [cursor.ReadWord() for _ in range(3)]
                          assert arrays == [0,0,0], arrays
                          cursor.ReadText(True, Maximum=1024)
                          cursor.TakeBytes(3)
                          children = [ReadNativeRef(cursor) for _ in range(cursor.ReadCount(256))]
                          assert children.count(controller)==1
                          node=owners[controller]
                          matrix=MetaCursor(bulk[node.PayloadOffset+4:node.EndOffset])
                          matrix.Offset=len(matrix.DataValue)-103
                          assert matrix.ReadWord()==1
                          desc=ReadNativeRef(matrix)
                          assert children.count(desc)==1
                          assert ReadNativeRef(MetaCursor(matrix.DataValue[-11:]))==feature.ObjectId
                          plane=ReadEntityLeaf(bulk,owners,ReadDescLeaf(bulk,owners,desc,feature.ObjectId))
                          name,datum,container=ReadOriginDatum(bulk,owners,plane,frame.attributes["fusion.component_object_id"])
                          print('typed support',name,'origin agrees',frame.transform.origin==datum.origin,'normal agrees',frame.transform.z_axis==datum.z_axis,'children',len(children),'parameters',len(params))
                      except (ValueError, AssertionError) as error:
                          print('typed support incomplete',str(error),'at cursor offset',cursor.Offset,'of',len(cursor.DataValue))
                      from convert.Formats.Fusion.Sketches.SketchPlacement import KSketchBase, ReadChildRoster
                      from convert.Formats.Fusion.Sketches.SketchRuleIds import ReadSketchRules
                      cont, = [r for r in spans if r.ObjectId==root.ObjectId and r.ClassGuid==KSketchBase]
                      cursor=MetaCursor(bulk[cont.PayloadOffset+4:cont.EndOffset]); cursor.Offset=28
                      cursor.ReadText(True,Maximum=1024)
                      roster=set(ReadChildRoster(cursor) or ())
                      geom={int(e.provenance.native_id) for e in sketch.entities}
                      sets=ReadSketchRules(bulk,root)
                      rules=set(sets[0]+sets[1])
                      print('native members',len(roster),'extra rule members',len((roster-geom)&rules),'unaccounted children',len(roster-geom-rules),'unlisted geometry',len(geom-roster),'complete neutral rules',HasSketchRules(bulk,root,sketch))
                      print(sample.split("/")[-1], "roster", bool(sketch.attributes.get("fusion.geometry_child_ids")), "support",frame.attributes.get("fusion.native_support_resolved"), "rules",HasSketchRules(bulk,root,sketch), "projected",sum(bool(e.attributes.get("fusion.geometry_is_projected")) for e in sketch.entities), "steps",[str(s.kind) for s in doc.feature_timeline if s.sketch_id == sketch.id])
          PYTHON
      - name: Exercise editable profile exports and saved edit readback
        run: uv run --no-sync python -m pytest -q --tb=line tests/Convert/Freecad/{FusionAxisRevolveTests,FusionBodyRevTests,FusionEditTests,FusionPlaneRevolveTests,FusionRevolveTests,FusionScaleWriteTests,FusionSketchRuleTests,EditReadTests,ProfileReadTests,RingReadTests}.py tests/Convert/Api/Fusion/SketchRosterTests.py
      - name: Verify native sketch child ownership at the archive boundary
        run: uv run --no-sync python -m pytest -q tests/Convert/Api/Fusion/SketchRosterTests.py
      - name: Measure sketch membership agreement
        run: |
          uv run --no-sync python - <<'PYTHON'
          from pathlib import Path
          from convert.Formats.Fusion.ArchiveRead.IndexedArchive import OpenFusionZip
          from convert.Formats.Fusion.DocumentRead import ReadFusionDoc
          from convert.Formats.Fusion.Sketches.SketchRuleIds import ReadSketchRules
          from convert.Formats.Fusion.Sketches.SketchPlacement import KSketchBase
          from convert.Formats.Fusion.MetaCursor import MetaCursor
          from convert.Formats.Fusion.HistoryRef import ReadNativeRef
          base = Path('re/Fusion/Study')
          for sample in ['extents-f0f33a9a605f/distance_positive.f3d','holdouts-f8c508a73323/expression_depth.f3d','models-97a5e41e2ba7/revolve_full.f3d','bodyselections-62e42366c722/scale_two_bodies_point.f3d']:
              path = base / sample
              doc = ReadFusionDoc(path)
              with OpenFusionZip(path.read_bytes(), None) as archive:
                  bulk, spans = archive.ReadDesign()
                  for sketch in doc.sketches:
                      owner = int(sketch.provenance.native_id)
                      root, = [r for r in spans if r.IsPrimary and r.ObjectId == owner]
                      children = {int(e.provenance.native_id) for e in sketch.entities}
                      constraints, dimensions = ReadSketchRules(bulk,root)
                      expected = children.union(constraints,dimensions)
                      for r in spans:
                          if r.ObjectId != owner or r.ClassGuid != KSketchBase:
                              continue
                          cursor = MetaCursor(bulk[r.PayloadOffset+4:r.EndOffset])
                          cursor.Offset = 28
                          cursor.ReadText(True, Maximum=1024)
                          start = cursor.Offset
                          matches = []
                          for offset in range(start, min(start+64,len(cursor.DataValue))):
                              cursor.Offset = offset
                              try:
                                  count = cursor.ReadCount(10000)
                                  if count < len(children) or not count:
                                      continue
                                  ids = {ReadNativeRef(cursor) for _ in range(count)}
                              except ValueError:
                                  continue
                              if children <= ids:
                                  matches.append((offset-start,count,len(ids-expected),len(expected-ids)))
                          print(path.name,'entities',len(children),'rules',len(constraints)+len(dimensions),'membership counts',matches)
          PYTHON
      - name: Inspect the partition inputs for missing solids
        run: |
          mkdir -p "$RUNNER_TEMP/kit-base"
          git archive fa4c497e4 src | tar -x -C "$RUNNER_TEMP/kit-base"
          cat > "$RUNNER_TEMP/compare-source.py" <<'PY'
          from pathlib import Path
          from convert import open_document
          from convert.Geometry import Parasolid
          from convert.adapters.freecad.Brep import BrepModelBrep
          folder = Path('re/solidworks/examples/Single Turbo Dual Overhead Cam V8 - KDP - 2024')
          for name in ('10MM x 20MM x 13MM head 316 Stainless Steel Socket Head Screw.SLDPRT', '8MM x 15mm - 12 point screw.SLDPRT', 'CUIETA DE ENTRADA DE GASES.SLDPRT'):
              doc = open_document(folder / name)
              print(name, [(cfg.name,cfg.active) for cfg in doc.configurations], 'has_brep', doc.brep is not None)
              for payload in doc.brep_payloads:
                  if payload.data:
                      model, why = Parasolid.ReadBrepResult(payload.data) if hasattr(Parasolid, "ReadBrepResult") else (Parasolid.DecodeBrepModel(payload.data), "")
                      print(payload.source_stream, payload.kind, len(payload.data), getattr(Parasolid.ParaHeaderData(payload.data), 'schema', None), model is not None, why)
              if doc.brep:
                  try:
                      BrepModelBrep(doc.brep)
                  except ValueError as error:
                      print(str(error))
          PY
          for source in "$RUNNER_TEMP/kit-base/src" "$PWD/src"; do
            echo "$source"
            PYTHONPATH="$source" .venv/bin/python "$RUNNER_TEMP/compare-source.py"
          done
      - name: Identify changed fields against the original archived reporter
        run: |
          set -eu
          revision=92fd0da165cf3eed3e50331459cf2ea3e983f2be
          git fetch --no-tags --filter=blob:none origin "$revision"
          reference="$RUNNER_TEMP/rectangle-reference"
          git worktree add --detach --no-checkout "$reference" "$revision"
          git -C "$reference" restore --source=HEAD --staged --worktree -- src re/automation re/Fusion/Study re/solidworks/archive
          python - "$reference/re/automation/PairedCaptureIntake.py" <<'PYTHON'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          source = path.read_text()
          original = 'self.root, "rev-list", "--objects", "--no-object-names", revision + "^@"'
          assert source.count(original) == 1
          path.write_text(source.replace(original, original.replace('"--objects",', '"--missing=print", "--objects",')).replace('self.ancestry[revision] = set(git(', 'self.ancestry[revision] = set(item.removeprefix("?") for item in git('))
          PYTHON
          .venv/bin/python "$reference/re/automation/RectanglePairEvidence.py" > "$RUNNER_TEMP/reference.json"
          .venv/bin/python re/automation/RectanglePairEvidence.py > "$RUNNER_TEMP/current.json"
          sha256sum "$RUNNER_TEMP/reference.json" "$RUNNER_TEMP/current.json"
          python - "$RUNNER_TEMP/reference.json" "$RUNNER_TEMP/current.json" <<'PY'
          from collections import Counter
          import json, sys
          from pathlib import Path
          def leaves(value, path=()):
              if isinstance(value, dict):
                  for key, element in value.items():
                      yield from leaves(element, (*path, key))
              elif isinstance(value, list):
                  for index, element in enumerate(value):
                      yield from leaves(element, (*path, index))
              else:
                  yield path, value
          before, after = (dict(leaves(json.loads(Path(file).read_text()))) for file in sys.argv[1:])
          assert before.keys() == after.keys()
          changes = Counter((str(path[-2]), str(path[-1]), repr(before[path]), repr(after[path])) for path in before if before[path] != after[path])
          for fields, count in changes.items():
              print(count, fields)
          PY

  freecad-application:
    name: Reopen editable exports in FreeCAD
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.5"
      - run: uv sync --frozen --no-default-groups --extra dev --python 3.14
      - name: Install the FreeCAD command line application
        run: |
          sudo install -d -o "$USER" /opt/kit-freecad
          "$CONDA/bin/conda" create --yes --override-channels --channel conda-forge --prefix /opt/kit-freecad freecad=1.1.3
          ls /opt/kit-freecad/bin | grep -i '^freecad'
      - name: Recompute save reopen and edit real documents
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eu
          app=$(find /opt/kit-freecad/bin -maxdepth 1 -iname freecadcmd -print -quit)
          test -n "$app"
          KIT_FREECAD_ORACLE="$app" /opt/kit-freecad/bin/python --version
          KIT_FREECAD_ORACLE="$app" .venv/bin/python -m pytest -q -rs --tb=line tests/Convert/Freecad/{FusionAxisRevolveTests,FusionBodyRevTests,FusionEditTests,FusionPlaneRevolveTests,FusionRevolveTests,FusionScaleWriteTests,FusionSketchRuleTests,EditReadTests,ProfileReadTests,RingReadTests}.py
