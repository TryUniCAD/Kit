name: Cubic approval

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approval:
    name: Cubic approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Reads Cubic approvals and merge-queue membership.
    steps:
      - name: Require the actual Cubic approval for every PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const Repository = context.repo;
            const CubicLogin = "cubic-dev-ai[bot]";
            const CubicUserId = 191113872;
            const PullHeads = new Map();

            if (context.eventName === "merge_group") {
              const Group = context.payload.merge_group;
              const Branch = Group.base_ref.replace(/^refs\/heads\//, "");
              const Entries = [];
              let Cursor = null;
              do {
                const Result = await github.graphql(
                  `query($owner:String!,$name:String!,$branch:String!,$cursor:String) {
                    repository(owner:$owner,name:$name) {
                      mergeQueue(branch:$branch) {
                        entries(first:100,after:$cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes { pullRequest { number headRefOid baseRefName state } }
                        }
                      }
                    }
                  }`,
                  { owner: Repository.owner, name: Repository.repo, branch: Branch, cursor: Cursor },
                );
                const Queue = Result.repository.mergeQueue;
                if (!Queue) throw new Error("The merge queue is unavailable");
                Entries.push(...Queue.entries.nodes);
                Cursor = Queue.entries.pageInfo.hasNextPage ? Queue.entries.pageInfo.endCursor : null;
              } while (Cursor);
              for (const Entry of Entries) {
                const Pull = Entry.pullRequest;
                if (!Pull || Pull.state !== "OPEN" || Pull.baseRefName !== Branch) continue;
                const Comparison = await github.rest.repos.compareCommits({
                  ...Repository,
                  base: Pull.headRefOid,
                  head: Group.head_sha,
                });
                if (["ahead", "identical"].includes(Comparison.data.status)) {
                  PullHeads.set(Pull.number, Pull.headRefOid);
                }
              }
              if (!PullHeads.size) throw new Error("No queued PR heads were found in this merge group");
            } else {
              PullHeads.set(context.payload.pull_request.number, context.payload.pull_request.head.sha);
            }

            for (const [PullNumber, ExpectedHead] of PullHeads) {
              const Initial = await github.rest.pulls.get({ ...Repository, pull_number: PullNumber });
              const HeadSha = Initial.data.head.sha;
              if (Initial.data.state !== "open") throw new Error(`PR ${PullNumber} is no longer open`);
              if (HeadSha !== ExpectedHead) {
                throw new Error(`PR ${PullNumber} changed after this event or merge-group membership check`);
              }
              const Reviews = await github.paginate(github.rest.pulls.listReviews, {
                ...Repository,
                pull_number: PullNumber,
                per_page: 100,
              });
              const CubicReviews = Reviews.filter((Review) =>
                Review.user?.id === CubicUserId &&
                Review.user?.login === CubicLogin &&
                Review.user?.type === "Bot" &&
                Review.state !== "PENDING",
              ).sort((Left, Right) => Right.id - Left.id);
              const Latest = CubicReviews[0];
              if (!Latest || Latest.state !== "APPROVED" || Latest.commit_id !== HeadSha) {
                throw new Error(`PR ${PullNumber} needs an actual Cubic APPROVED review on ${HeadSha}; a comment, green review check, or human approval cannot satisfy this gate`);
              }
              const Current = await github.rest.pulls.get({ ...Repository, pull_number: PullNumber });
              if (Current.data.state !== "open" || Current.data.head.sha !== HeadSha) {
                throw new Error(`PR ${PullNumber} changed during approval verification`);
              }
              await core.summary.addRaw(`Cubic approved PR #${PullNumber} at ${HeadSha}\n`).write();
            }
