name: Fusion compatibility

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: FusionCompatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-compatibility:
    name: Fusion archive compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --no-default-groups --extra dev --python 3.14

      - name: Exercise native parameter archives
        run: >-
          uv run --no-sync --python 3.14 pytest
          tests/convert/formats/FusionCodec/Parameters/FusionParamArchiveTests.py
