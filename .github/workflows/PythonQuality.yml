name: Python quality gate

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci-reuse:
    name: PR CI reuse (Python quality gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - name: Checkout phase selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &ReadPhase
        name: Read the trusted base validation phase
        id: phase
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { SetPhase } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/CiPhase.cjs`);
            await SetPhase({ github, context, core });

  ruff:
    if: github.event_name == 'pull_request'
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *ReadPhase

      - name: Set up uv
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run Ruff over tracked Python
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: uv run ruff check .

  black:
    if: github.event_name == 'pull_request'
    name: Black
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *ReadPhase

      - name: Set up uv
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run Black over tracked Python
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: uv run black --check .

  pyright:
    if: ${{ !cancelled() }}
    name: Pyright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *ReadPhase

      - name: Set up uv
        if: steps.phase.outputs.phase != ''
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        if: steps.phase.outputs.phase != ''
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run strict Pyright
        if: steps.phase.outputs.phase != ''
        run: uv run pyright

  mypy:
    if: ${{ !cancelled() }}
    name: Mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *ReadPhase

      - name: Set up uv
        if: steps.phase.outputs.phase != ''
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        if: steps.phase.outputs.phase != ''
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run strict Mypy
        if: steps.phase.outputs.phase != ''
        run: uv run mypy
