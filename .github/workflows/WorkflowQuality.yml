name: Workflow quality

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: WorkflowQuality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci-reuse:
    name: PR CI reuse (Workflow quality)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - name: Checkout phase selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the trusted base validation phase
        id: phase
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { SetPhase } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/CiPhase.cjs`);
            await SetPhase({ github, context, core });

  policy:
    if: >-
      always() && !cancelled() && (needs.pr-ci-reuse.outputs.phase == 'legacy' || needs.pr-ci-reuse.outputs.phase == 'merge_group')
    needs: pr-ci-reuse
    name: Verify CI policy and pytest compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Verify repository CI contracts at process boundaries
        run: >-
          uv run pytest tests/Policy/CodeqlPolicyTests.py
          tests/Policy/CiReportsTests.py tests/Policy/QueueAggregationTests.py
          tests/Policy/ReviewerAggregationTests.py tests/Steering/AgentSkillsMigrationTests.py
          tests/Convert/Api/ApiMetadataTests.py tests/Policy/DiffBreakdownTests.py
          tests/Policy/ShardPlanTests.py
          tests/Convert/Commands/CliRuntimeTests.py

      - name: Exercise native file reading and writing
        run: >-
          uv run pytest
          tests/Convert/Solidworks
          tests/Convert/Formats/ParasolidTests.py
          tests/Steering/RationaleCommentsTests.py

  codec-promotion:
    if: >-
      always() && !cancelled() && (needs.pr-ci-reuse.outputs.phase == 'legacy' || needs.pr-ci-reuse.outputs.phase == 'pull_request')
    needs: pr-ci-reuse
    name: Qualify reader and writer patches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"

      - name: Exercise code promotion through the public CLI
        env:
          QualificationImage: python@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
        run: |
          docker pull "$QualificationImage"
          ImageId=$(docker image inspect --format '{{.Id}}' "$QualificationImage")
          uv run --frozen --with 'numpy==2.4.6' --no-default-groups --extra dev --python 3.14 python re/automation/CodecPromotion/ProcessGate.py "$ImageId"

  research-cli:
    if: >-
      always() && !cancelled() && (needs.pr-ci-reuse.outputs.phase == 'legacy' || needs.pr-ci-reuse.outputs.phase == 'merge_group')
    needs: pr-ci-reuse
    name: Research CLI compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KIT_RESEARCH_CHECKOUT: ${{ github.workspace }}/ResearchCheckout
    steps:
      - name: Checkout candidate CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout candidate research tools separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ResearchCheckout
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install CLI and compatibility dependencies
        run: uv sync --frozen --no-default-groups --extra dev --python 3.14

      - name: Hydrate sealed research inputs for candidate CLI cases
        run: uv run --no-sync --python 3.14 python re/automation/CaptureHistory.py fetch --root ResearchCheckout

      - name: Verify deterministic tools through the installed CLI
        run: >-
          uv run --no-sync --python 3.14 python -m pytest tests/CliResearch -q

  research-cli-windows:
    if: >-
      always() && !cancelled() && (needs.pr-ci-reuse.outputs.phase == 'legacy' || needs.pr-ci-reuse.outputs.phase == 'merge_group')
    needs: pr-ci-reuse
    name: Research CLI Windows compatibility
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      KIT_RESEARCH_CHECKOUT: ${{ github.workspace }}/ResearchCheckout
    steps:
      - name: Checkout candidate CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout candidate research tools separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ResearchCheckout
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install CLI and compatibility dependencies
        run: uv sync --frozen --no-default-groups --extra dev --python 3.14

      - name: Hydrate sealed research inputs for candidate CLI cases
        run: uv run --no-sync --python 3.14 python re/automation/CaptureHistory.py fetch --root ResearchCheckout

      - name: Verify reader and controller exit statuses through the installed CLI
        run: >-
          uv run --no-sync --python 3.14 python -m pytest
          tests/CliResearch/BridgeRejectTests.py
          tests/CliResearch/SwReaderTests.py
          tests/CliResearch/FusionReaderTests.py
          tests/CliResearch/ReaderRejectTests.py
          tests/CliResearch/InterruptTests.py
          tests/CliResearch/LeaseFlowTests.py -q

  zizmor:
    if: >-
      always() && !cancelled() && (needs.pr-ci-reuse.outputs.phase == 'legacy' || needs.pr-ci-reuse.outputs.phase == 'pull_request')
    needs: pr-ci-reuse
    name: Zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Run Zizmor Actions audit
        run: uv run zizmor --pedantic .github/workflows

  actionlint:
    if: >-
      always() && !cancelled() && (needs.pr-ci-reuse.outputs.phase == 'legacy' || needs.pr-ci-reuse.outputs.phase == 'pull_request')
    needs: pr-ci-reuse
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        env:
          ActionlintVersion: "1.7.12"
          ActionlintSha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ArchivePath="${RUNNER_TEMP}/actionlint_${ActionlintVersion}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${ArchivePath}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ActionlintVersion}/actionlint_${ActionlintVersion}_linux_amd64.tar.gz"
          echo "${ActionlintSha256}  ${ArchivePath}" | sha256sum --check --
          tar --extract --gzip --file "${ArchivePath}" --directory "${RUNNER_TEMP}" actionlint
          chmod u+x "${RUNNER_TEMP}/actionlint"

      - name: Run actionlint workflow analysis
        run: '"${RUNNER_TEMP}/actionlint"'
