name: Path policies

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci-reuse:
    name: Validation phase (PathPolicies)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - name: Checkout phase selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &ReadPhase
        name: Read the trusted base validation phase
        id: phase
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { SetPhase } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/CiPhase.cjs`);
            await SetPhase({ github, context, core });

  verify-path-policies:
    if: github.event_name == 'pull_request'
    name: Verify path policies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - *ReadPhase

      - name: Reject tracked DLLs and DMGs
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          Arguments=(.)
          if [ -n "$BASE_REF" ]; then
            Arguments+=("$BASE_REF" "$HEAD_REF")
          fi
          bash .github/scripts/CheckBinaries.sh "${Arguments[@]}"

      - name: Verify binary guard at the Git index boundary
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: bash tests/Policy/BinaryGuard.sh

      - name: Set up uv
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: uv sync --frozen --extra dev --python 3.11

      - name: Verify complete tracked tree
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: uv run python -m tools.Policy.CheckPaths

      - name: Verify changed destination paths
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || '' }}
        run: |
          Arguments=()
          if [ -n "$BASE_REF" ]; then
            Arguments=(--base "$BASE_REF" --head "$HEAD_REF")
          fi
          uv run python -m tools.Policy.CheckPaths "${Arguments[@]}"

      - name: Verify path policy at the command boundary
        if: steps.phase.outputs.phase == 'legacy' || steps.phase.outputs.phase == 'pull_request'
        run: >-
          uv run --extra dev pytest tests/Policy/DirectoryPolicyTests.py tests/Policy/DirectoryRenameTests.py
          tests/Policy/PolicyCommandTest.py tests/Policy/GitModesTest.py
