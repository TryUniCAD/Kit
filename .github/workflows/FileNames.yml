name: File names

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-file-names:
    name: Verify PascalCase file names
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --python 3.11

      - name: Verify file name policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || '' }}
        run: |
          Arguments=()
          if [ -n "$BASE_REF" ]; then
            Arguments=(--base "$BASE_REF" --head "$HEAD_REF")
          fi
          set +e
          OutputText="$(uv run python -m tools.Policy.CheckPaths "${Arguments[@]}" 2>&1)"
          StatusCode=$?
          set -e
          if [ "$StatusCode" -gt 1 ]; then
            printf '%s\n' "$OutputText"
            exit "$StatusCode"
          fi
          if [ "$StatusCode" -eq 1 ] && ! printf '%s\n' "$OutputText" | grep -Eq '^path policy failed with [0-9]+ violations$'; then
            printf '%s\n' "$OutputText"
            exit 1
          fi
          FindingText="$(printf '%s\n' "$OutputText" | grep ': PTH001:' || true)"
          if [ -n "$FindingText" ]; then
            printf '%s\n' "$FindingText"
            exit 1
          fi
          echo "file name policy passed"
