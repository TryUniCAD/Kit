name: Python steering

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-python:
    name: Verify Python steering rules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups --all-extras --python 3.11

      - name: Verify tracked Python sources
        run: |
          mapfile -d '' PythonFiles < <(git ls-files -z -- '*.py')
          uv run python -m tools.steering.SteeringCompliance "${PythonFiles[@]}"

      - name: Verify Python formatting
        run: uv run black --check .
